<div id="screenshots-{{ .Ordinal }}" class="carousel slide carousel-fade mt-3 rounded shadow-sm overflow-hidden" data-ride="carousel" data-interval="2500" data-pause="hover">
  <div class="carousel-inner">
    {{ range $i, $img := .Params }}
    <div class="carousel-item{{ if eq $i 0 }} active{{ end }}">
      <img src="{{ $img }}" class="d-block w-100" alt="Screenshot {{ add $i 1 }}" style="max-height:480px;object-fit:contain;background:#fff;">
    </div>
    {{ end }}
  </div>
  <a class="carousel-control-prev" href="#screenshots-{{ .Ordinal }}" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" href="#screenshots-{{ .Ordinal }}" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </a>
  <ol class="carousel-indicators">
    {{ range $i, $img := .Params }}
    <li data-target="#screenshots-{{ $.Ordinal }}" data-slide-to="{{ $i }}"{{ if eq $i 0 }} class="active"{{ end }}></li>
    {{ end }}
  </ol>
</div>
