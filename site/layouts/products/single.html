{{ define "main" }}
{{ partial "breadcrumbs" . }}
<section class="resume-section p-3 p-lg-5 d-flex d-column">
  <div>
    {{ with .Params.image }}
    <div class="detail-hero mb-4">
      <img src="{{ . }}" alt="{{ $.Title }}"/>
    </div>
    {{ end }}
    <h2 class="mb-0"><span class="text-primary">{{ .Title }}</span>{{ with .Params.subtitle }} <span class="text-muted" style="font-size:0.6em;">({{ . }})</span>{{ end }}</h2>
    {{ .Content }}
    {{ with .Params.link }}<p class="mt-3"><a class="cta-link" href="{{ . }}" target="_blank" rel="noopener noreferrer">Learn More →</a></p>{{ end }}
    <p class="mt-3">{{ partial "techtags" . }}</p>
  </div>
</section>
{{ end }}
